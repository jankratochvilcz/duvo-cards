<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; connect-src 'self'">
<title>SHIP IT — Playtest Build</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#0B0E13;
  --fog:#141A20;
  --fog2:#1C232B;
  --line:#2A333C;
  --signal:#E9EDEF;
  --muted:#8B96A0;
  --latency:#39FF88;
  --hallucination:#FF3355;
  --injection:#2F80FF;
  --techdebt:#B8C0C8;
  --good:#57C785;
  --bad:#E5555A;
  --gold:#E3C567;
  --mono:'IBM Plex Mono', ui-monospace, 'SF Mono', monospace;
  --sans:'Inter', system-ui, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--void);color:var(--signal);font-family:var(--sans);min-height:100vh;}
button{font-family:inherit;cursor:pointer;}
button:focus-visible, .card:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px;}

/* ---------- Hero / Select screen ---------- */
.hero{padding:18px 0 10px;text-align:center;}
.hero-title{font-family:var(--mono);font-weight:700;font-size:clamp(26px,5vw,42px);letter-spacing:0.02em;margin:0;}
.hero-title .cursor{display:inline-block;width:0.5em;background:var(--gold);margin-left:6px;animation:blink 1s step-end infinite;}
@keyframes blink{50%{opacity:0;}}
.hero-sub{color:var(--muted);font-family:var(--mono);font-size:12px;margin-top:6px;letter-spacing:0.03em;}

.pitch{max-width:720px;margin:14px auto 0;text-align:left;background:var(--fog);border:1px solid var(--line);border-radius:10px;padding:14px 16px;}
.pitch-lead{margin:0 0 10px;font-size:14px;line-height:1.5;color:var(--signal);}
.pitch-rules{margin:0;padding-left:18px;font-size:13px;line-height:1.55;color:var(--muted);}
.pitch-rules li{margin-bottom:4px;}
.pitch-rules b{color:var(--signal);font-weight:600;}

.select-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;}
@media (max-width:700px){.select-grid{grid-template-columns:1fr;}}
.select-col h3{font-family:var(--mono);font-size:11px;letter-spacing:0.12em;color:var(--muted);text-transform:uppercase;margin:0 0 6px 2px;}
.deck-option{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:var(--fog);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:7px 10px;margin-bottom:5px;color:var(--signal);transition:transform .12s, border-color .12s;}
.deck-art{flex:0 0 44px;width:44px;height:44px;object-fit:cover;border-radius:6px;
  border:1px solid color-mix(in srgb, var(--accent,var(--gold)) 35%, transparent);}
.deck-option-body{min-width:0;flex:1;}
.deck-option:hover{transform:translateY(-1px);border-color:var(--accent);}
.deck-option.selected{background:var(--fog2);box-shadow:0 0 0 2px var(--accent) inset;}
.deck-option .dname{font-family:var(--mono);font-weight:600;font-size:13px;color:var(--accent);line-height:1.2;}
.deck-option .dblurb{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.deck-latency{--accent:var(--latency);}
.deck-hallucination{--accent:var(--hallucination);}
.deck-injection{--accent:var(--injection);}
.deck-techdebt{--accent:var(--techdebt);}

.mode-row{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap;}
.mode-btn{background:var(--fog);border:1px solid var(--line);color:var(--signal);padding:8px 14px;border-radius:20px;font-size:13px;font-family:var(--mono);}
.mode-btn.active{background:var(--gold);color:#1a1508;border-color:var(--gold);}

.start-btn{display:block;margin:16px auto 0;background:var(--gold);color:#1a1508;border:none;padding:12px 28px;font-family:var(--mono);font-weight:700;font-size:14px;border-radius:8px;letter-spacing:0.04em;}
.start-btn:disabled{opacity:0.35;cursor:not-allowed;}
.rules-toggle{display:block;margin:10px auto 0;background:none;border:none;color:var(--muted);padding:4px 8px;font-size:12px;font-family:var(--mono);text-decoration:underline;text-underline-offset:3px;}
.rules-toggle:hover{color:var(--signal);}
.rules-panel{max-width:720px;margin:10px auto 0;background:var(--fog);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:13px;line-height:1.55;}
.rules-panel h4{font-family:var(--mono);color:var(--gold);margin:12px 0 4px;font-size:12px;letter-spacing:0.04em;}
.rules-panel h4:first-child{margin-top:0;}
.rules-panel ol,.rules-panel ul{margin:4px 0;padding-left:20px;}
.rules-panel p{margin:0 0 6px;}

/* ---------- Match screen ---------- */
.match{display:none;}
.match.active{display:block;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--fog);border:1px solid var(--line);border-radius:10px;padding:10px 16px;margin-bottom:14px;flex-wrap:wrap;}
.score{font-family:var(--mono);font-size:13px;}
.score b{font-size:16px;}
.turn-indicator{font-family:var(--mono);font-size:12px;color:var(--muted);}
.new-match-btn{background:none;border:1px solid var(--line);color:var(--muted);padding:6px 12px;border-radius:16px;font-size:12px;}

.board-area{display:flex;gap:14px;}
@media (max-width:900px){.board-area{flex-direction:column;}}
.board-main{flex:1;min-width:0;}
.board-row{background:var(--fog);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;}
.board-row-label{font-family:var(--mono);font-size:11px;letter-spacing:0.08em;color:var(--muted);text-transform:uppercase;margin-bottom:8px;display:flex;justify-content:space-between;}
.slots{display:flex;gap:10px;flex-wrap:wrap;}
.slot{flex:1;min-width:150px;min-height:210px;border:1px dashed var(--line);border-radius:8px;padding:8px;display:flex;align-items:center;justify-content:center;}
.slot.filled{border-style:solid;padding:6px;}
.slot-empty-label{color:var(--muted);font-family:var(--mono);font-size:11px;text-align:center;}

.hand-row{background:var(--fog);border:1px solid var(--line);border-radius:10px;padding:12px;}
.hand-hint{font-family:var(--mono);font-size:10px;color:var(--muted);margin:-2px 0 8px;}
.hand-cards{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;align-items:flex-start;}

/* TCG-format card: fixed portrait ratio, ~5:7, like a physical trading card */
.card{position:relative;flex:0 0 168px;width:168px;height:250px;background:var(--fog2);
  border:1px solid var(--line);border-radius:12px;padding:9px;text-align:left;color:var(--signal);
  display:flex;flex-direction:column;overflow:hidden;transition:transform .12s,border-color .12s;}
@media (max-width:640px){.card{flex:0 0 138px;width:138px;height:206px;padding:7px;}}
.card.playable:hover{border-color:var(--gold);transform:translateY(-3px);}
.card.disabled{opacity:0.42;}
.card.board{flex:0 0 194px;width:194px;height:288px;padding:11px;cursor:default;transform:none !important;}
@media (max-width:640px){.card.board{flex:0 0 164px;width:164px;height:244px;padding:8px;}}
.card-latency{--accent:var(--latency);}
.card-hallucination{--accent:var(--hallucination);}
.card-injection{--accent:var(--injection);}
.card-techdebt{--accent:var(--techdebt);}

.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:5px;}
.card-cost{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:var(--accent,var(--gold));
  color:#0B0E13;font-family:var(--mono);font-weight:700;font-size:10.5px;display:flex;align-items:center;justify-content:center;}
.card-name{font-family:var(--mono);font-weight:700;font-size:11.5px;line-height:1.15;flex:1;text-align:left;}
.card-type{font-family:var(--mono);font-size:8px;letter-spacing:0.08em;text-transform:uppercase;
  color:var(--accent,var(--muted));margin:4px 0 6px;}
.card-art{position:relative;flex:0 0 88px;border-radius:8px;overflow:hidden;margin-bottom:6px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(150deg, color-mix(in srgb, var(--accent,var(--gold)) 38%, var(--fog)) 0%, var(--fog) 100%);}
.card-art img{width:100%;height:100%;object-fit:cover;display:block;}
.card-art .glyph{font-family:var(--mono);font-weight:700;font-size:28px;line-height:1;
  color:color-mix(in srgb, var(--accent,var(--gold)) 70%, #fff);opacity:0.85;user-select:none;}

/* Power/Stability now live in their own row below the art, not overlapping it */
.card-stats-row{display:flex;gap:6px;margin-bottom:6px;}
.card-stat{flex:1;display:flex;align-items:center;justify-content:center;gap:3px;
  border:1px solid var(--line);border-radius:6px;padding:3px 4px;font-family:var(--mono);font-size:9.5px;font-weight:700;}
.card-stat.power{color:#FF8A65;border-color:#FF8A65;}
.card-stat.stability{color:#67D3E0;border-color:#67D3E0;}
.card-stat .lbl{font-size:7px;color:var(--muted);font-weight:500;letter-spacing:0.03em;}

.card-rules{font-size:9px;color:var(--signal);line-height:1.28;min-height:20px;}
.card-flavor{font-size:8px;color:var(--muted);font-style:italic;line-height:1.3;
  border-top:1px solid var(--line);padding-top:5px;margin-top:auto;}

.action-row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;}
.action-btn{background:var(--gold);color:#1a1508;border:none;padding:10px 18px;border-radius:8px;font-family:var(--mono);font-weight:700;font-size:13px;}
.action-btn:disabled{opacity:0.3;cursor:not-allowed;}
.swap-btn{background:none;border:1px solid var(--line);color:var(--signal);padding:10px 14px;border-radius:8px;font-family:var(--mono);font-size:12px;}
.swap-btn:disabled{opacity:0.4;cursor:not-allowed;}
.risk-note{font-family:var(--mono);font-size:11px;color:var(--bad);margin-top:8px;}

.turn-banner{font-family:var(--mono);font-weight:700;font-size:15px;text-align:center;
  padding:12px 16px;border-radius:10px;margin-bottom:14px;letter-spacing:0.02em;color:var(--signal);
  background:color-mix(in srgb, var(--accent,var(--gold)) 22%, var(--fog));
  border:2px solid var(--accent,var(--gold));}
.turn-banner .sub{display:block;font-size:10.5px;font-weight:500;color:var(--muted);margin-top:3px;letter-spacing:0.04em;}
.board-row.active-row{border-color:var(--accent,var(--gold));box-shadow:0 0 0 1px var(--accent,var(--gold)) inset;}
.board-row.inactive-row{opacity:0.62;}
.hand-row.active-row{border-color:var(--accent,var(--gold));box-shadow:0 0 0 1px var(--accent,var(--gold)) inset;}

.log-panel{flex:0 0 280px;background:var(--fog);border:1px solid var(--line);border-radius:10px;padding:12px;font-family:var(--mono);font-size:11.5px;line-height:1.6;max-height:560px;overflow-y:auto;}
@media (max-width:900px){.log-panel{flex:none;max-height:220px;order:5;}}
.log-panel .log-title{color:var(--muted);text-transform:uppercase;letter-spacing:0.1em;font-size:10px;margin-bottom:8px;}
.log-line{color:var(--muted);margin-bottom:4px;}
.log-line.good{color:var(--good);}
.log-line.bad{color:var(--bad);}
.log-line.you{color:var(--signal);}

.modal-overlay{position:fixed;inset:0;background:rgba(4,6,8,0.75);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
.modal-box{background:var(--fog2);border:1px solid var(--line);border-radius:10px;padding:18px;max-width:640px;width:100%;max-height:85vh;overflow-y:auto;}
.modal-box h4{font-family:var(--mono);font-size:13px;color:var(--gold);margin:0 0 12px;}
.modal-opt{display:block;width:100%;text-align:left;background:var(--fog);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:6px;color:var(--signal);font-family:var(--mono);font-size:12px;}
.modal-opt:hover{border-color:var(--gold);}
.modal-cards{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;}
.modal-cards .card{cursor:pointer;}
.modal-cards .card:hover{border-color:var(--gold);transform:translateY(-3px);}

.game-over{position:fixed;inset:0;background:rgba(4,6,8,0.88);display:flex;align-items:center;justify-content:center;z-index:60;flex-direction:column;text-align:center;padding:20px;}
.game-over h2{font-family:var(--mono);font-size:32px;color:var(--gold);margin:0 0 10px;}
.game-over p{color:var(--muted);margin:0 0 20px;}

.toast{position:sticky;top:0;z-index:45;background:var(--gold);color:#1a1508;font-family:var(--mono);
  font-weight:700;font-size:12.5px;padding:9px 14px;border-radius:8px;margin-bottom:10px;text-align:center;
  animation:toastIn .18s ease-out;}
@keyframes toastIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
.card.flash{animation:cardFlash 0.9s ease-out;}
@keyframes cardFlash{0%{box-shadow:0 0 0 3px var(--gold), 0 0 18px 2px var(--gold);}100%{box-shadow:0 0 0 0 transparent;}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:0.001ms !important;transition-duration:0.001ms !important;}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ========================= CARD DATA ========================= */
// Type labels shown to the player. Internal `type` values ('process'/'patch') are
// kept as-is in the data/engine to minimize risk; only display text changed.
const TYPE_LABEL = { process:'Agent', patch:'Overclock' };
const WIN_POINTS = 5;

// Escape text before concatenating into HTML. Card data is author-controlled today,
// but this keeps a future cards.json edit from becoming a stored XSS vector for visitors.
function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}
// Only allow relative art paths under art/…/*.png (blocks javascript:/https: src).
function safeArtSrc(path){
  if(typeof path!=='string') return '';
  return /^art\/[A-Za-z0-9_./-]+\.png$/.test(path) ? path : '';
}

function expand(list, deckKey){
  const out=[];
  list.forEach((tmpl,i)=>{
    const n = tmpl.count||1;
    for(let k=0;k<n;k++){
      out.push(Object.assign({}, tmpl, {uid: deckKey+'-'+i+'-'+k, deckKey, bonusPower:0, bonusStability:0, turnsSurvived:0, hasAttacked:false, usedGraceful:false}));
    }
  });
  return out;
}

let DECK_TEMPLATES = null;
let cardsLoadError = null;

async function loadCards(){
  try {
    const res = await fetch('data/cards.json', {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    ['latency','hallucination','injection','techdebt'].forEach(k=>{
      if(!Array.isArray(data[k])) throw new Error('cards.json missing deck '+k);
    });
    DECK_TEMPLATES = data;
  } catch(err){
    cardsLoadError = (err && err.message) ? err.message : String(err);
  }
  render();
}

const DECK_META = {
  latency:{label:'Latency', tag:'Aggro', blurb:'Fast, fragile, ends the game before it can be punished.', art:'art/factions/latency.png'},
  hallucination:{label:'Hallucination', tag:'Chaos', blurb:'Coin-flip swings — can blow out or fizzle completely.', art:'art/factions/hallucination.png'},
  injection:{label:'Prompt Injection', tag:'Interference', blurb:"Bounces, steals, and reroutes the opponent's plans — wins by making sure their board never works the way they wanted.", art:'art/factions/injection.png'},
  techdebt:{label:'Technical Debt', tag:'Scaling', blurb:'Weak early, dangerous if the game runs long.', art:'art/factions/techdebt.png'},
};

/* ========================= GAME STATE ========================= */
let state = null;
let modal = null; // {title, items:[{label,value}], onPick}
let screen = 'select'; // 'select' | 'match'
let pickA = null, pickB = null, mode = 'ai'; // mode: 'ai' or 'hotseat'
let rulesOpen = false;
let toast = null;     // transient banner text shown for the most recent action
let flashUid = null;  // uid of a card to briefly highlight in its board slot

function showToast(text, ms){
  toast = text;
  render();
  const capturedText = text;
  setTimeout(()=>{ if(toast===capturedText){ toast=null; render(); } }, ms||1400);
}
function flashCard(uid, ms){
  flashUid = uid;
  setTimeout(()=>{ if(flashUid===uid){ flashUid=null; render(); } }, ms||900);
}
function wait(ms){ return new Promise(res=>setTimeout(res, ms)); }

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function newPlayerState(deckKey, extraCard){
  const deck = shuffle(expand(DECK_TEMPLATES[deckKey], deckKey));
  const hand = deck.splice(0, extraCard ? 6 : 5);
  return {
    deckKey, deck, hand, discard:[],
    primary:null, backup:null,
    shipPoints:0, turnsTaken:0,
    deploysRemaining:0, patchesRemaining:0,
    skipNextPatch:false, skipNextDeploy:false, skipNextAttack:false, skipAttackThisTurn:false,
    extraAttack:0, rerollCharges:0, attackedThisTurn:false,
    deploysThisTurn:0, overclockPlayedThisTurn:false,
  };
}

function startMatch(){
  if(!DECK_TEMPLATES || !pickA || !pickB) return;
  state = {
    players:{A:newPlayerState(pickA, false), B:newPlayerState(pickB, true)},
    active:'A',
    log:[],
    gameOver:false, winner:null,
  };
  screen='match';
  addLog('Match started. '+DECK_META[pickA].label+' (You) vs '+DECK_META[pickB].label+' ('+(mode==='ai'?'AI':'Opponent')+').','you');
  startTurn('A');
  render();
}

function label(key){ return key==='A' ? 'You' : (mode==='ai' ? 'Opponent (AI)' : 'Opponent'); }
// In hotseat, "You"/"Opponent" is ambiguous since both sides share one device.
// Use neutral, fixed identities instead — whose *turn* it is gets shown separately via the turn banner.
function hotseatName(key){ return key==='A' ? 'Player A' : 'Player B'; }

function addLog(msg, cls){
  state.log.push({msg, cls: cls||''});
  if(state.log.length>200) state.log.shift();
}

/* ---------- effective stats ---------- */
function effPower(inst, ownerState){
  let p = inst.power + (inst.bonusPower||0) + (inst.tempPowerBonus||0);
  if(inst.effect==='scalePowerDiscard3') p += Math.floor(ownerState.discard.length/2);
  if(inst.effect==='scalePowerByPatchDiscard') p += ownerState.discard.filter(c=>c.type==='patch').length;
  if(inst.effect==='growPerTurnSurvive') p += (inst.turnsSurvived||0);
  if(inst.effect==='scaleBothByDiscard') p += Math.floor(ownerState.discard.length/3);
  return p;
}
function effStability(inst, ownerState){
  let s = inst.stability + (inst.bonusStability||0);
  if(inst.effect==='scaleStabilityByDiscard') s += ownerState.discard.length;
  if(inst.effect==='growPerTurnSurvive') s += (inst.turnsSurvived||0);
  if(inst.effect==='scaleBothByDiscard') s += Math.floor(ownerState.discard.length/3);
  return s;
}
// Cards with these effects can't be removed by an opponent's targeted board-state effects
// (bounce, forced swap, hard removal). Combat crashes still work normally.
function isImmuneToOppRemoval(card){
  return !!card && (card.effect==='growPerTurnSurvive' || card.effect==='sandboxImmune');
}

function coinFlip(labelText, favorKey){
  let heads;
  if(favorKey && state.players[favorKey].rerollCharges>0){
    state.players[favorKey].rerollCharges--;
    heads = true;
    addLog(labelText+': reroll charge used — forced favorable result.', 'good');
  } else {
    heads = Math.random()<0.5;
    addLog(labelText+': '+(heads?'HEADS':'TAILS'), heads?'good':'bad');
  }
  return heads;
}

function drawCards(st, n){
  for(let i=0;i<n && st.deck.length>0;i++){ st.hand.push(st.deck.pop()); }
}
function discardRandom(st){
  if(st.hand.length===0) return;
  const i = Math.floor(Math.random()*st.hand.length);
  const c = st.hand.splice(i,1)[0];
  st.discard.push(c);
  addLog(label(st===state.players.A?'A':'B')+' discards '+c.name+' at random.');
}

/* ---------- deploy / patch ---------- */
function oppKeyOf(key){ return key==='A'?'B':'A'; }

function canDeploy(ownerKey, card){
  const st = state.players[ownerKey];
  const oppSt = state.players[oppKeyOf(ownerKey)];
  const penalty = [oppSt.primary,oppSt.backup].filter(c=>c && c.effect==='raiseOppCost').length;
  const cap = Math.min(st.turnsTaken,4);
  const slotFree = !st.primary || !st.backup;
  return st.deploysRemaining>0 && slotFree && (card.cost+penalty)<=cap;
}

function deployCard(ownerKey, uid){
  const st = state.players[ownerKey];
  const idx = st.hand.findIndex(c=>c.uid===uid);
  if(idx<0) return;
  const card = st.hand[idx];
  if(!canDeploy(ownerKey, card)){ addLog('Cannot deploy '+card.name+' right now.'); render(); return; }
  st.hand.splice(idx,1);
  card.deployedTurn = st.turnsTaken;
  if(!st.primary) st.primary = card; else st.backup = card;
  st.deploysRemaining--;
  addLog(label(ownerKey)+' deploy '+card.name+' (Cost '+card.cost+').', ownerKey==='A'?'you':'');
  showToast(label(ownerKey)+' deploys '+card.name);
  flashCard(card.uid);
  if(card.effect==='bonusIfSecondDeploy' && st.deploysThisTurn>0){
    card.bonusPower += 2;
    addLog(card.name+' rides in on an already-busy turn and gains +2 Power.', 'good');
  }
  if(card.effect==='bonusIfOverclockedThisTurn' && st.overclockPlayedThisTurn){
    card.bonusPower += 3;
    addLog(card.name+' catches the window right after an Overclock and gains +3 Power.', 'good');
  }
  st.deploysThisTurn = (st.deploysThisTurn||0) + 1;
  if(card.effect==='deployDraw2Discard1'){
    drawCards(st,2);
    addLog(card.name+' draws 2.');
    promptDiscardOne(ownerKey);
  }
  if(card.effect==='shuffleDiscardIn'){
    const n = st.discard.length;
    st.deck = shuffle(st.deck.concat(st.discard)); st.discard=[];
    if(n>0){
      const grow = Math.floor(n/2);
      if(grow>0){
        card.bonusPower = (card.bonusPower||0) + grow;
        addLog(card.name+' shuffles '+n+' cards back and gains +'+grow+' Power.');
      } else {
        addLog(card.name+' shuffles the discard pile back into the deck.');
      }
    } else {
      addLog(card.name+' finds an empty discard pile.');
    }
  }
  if(card.effect==='bounceOppPrimary'){
    const oppSt = state.players[oppKeyOf(ownerKey)];
    if(isImmuneToOppRemoval(oppSt.primary)){
      addLog(oppSt.primary.name+" can't be removed by opponent effects — the bounce fails.");
    } else if(oppSt.primary){
      addLog(card.name+' bounces '+oppSt.primary.name+" back to the opponent's hand.");
      oppSt.hand.push(oppSt.primary);
      oppSt.primary = null;
      if(oppSt.backup){
        oppSt.primary = oppSt.backup;
        oppSt.backup = null;
        addLog(label(oppKeyOf(ownerKey))+"'s Backup is forced into Primary after the bounce.");
      }
    } else {
      addLog(card.name+' finds no Primary Agent to bounce.');
    }
  }
  if(card.effect==='peekStealCard'){
    const oppSt = state.players[oppKeyOf(ownerKey)];
    if(oppSt.hand.length===0){
      addLog(card.name+" finds the opponent's hand empty.");
    } else {
      modal = {
        title:"Take 1 card from opponent's hand",
        items: oppSt.hand.map(hc=>({label:hc.name, value:hc.uid, card:hc})),
        onPick:(pickedUid)=>{
          const i = oppSt.hand.findIndex(hc=>hc.uid===pickedUid);
          if(i>=0){
            const stolen = oppSt.hand.splice(i,1)[0];
            st.hand.push(stolen);
            addLog(label(ownerKey)+' takes '+stolen.name+" from the opponent's hand.");
          }
          modal=null; render();
        }
      };
    }
  }
  if(card.effect==='forceSwapOpp'){
    const oppSt = state.players[oppKeyOf(ownerKey)];
    if(isImmuneToOppRemoval(oppSt.primary)){
      addLog(oppSt.primary.name+" can't be targeted by opponent effects — the reroute fails.");
    } else if(oppSt.primary && oppSt.backup){
      const t = oppSt.primary; oppSt.primary = oppSt.backup; oppSt.backup = t;
      addLog(card.name+" forces the opponent's Primary and Backup to swap.");
    } else if(!oppSt.primary && oppSt.backup){
      oppSt.primary = oppSt.backup; oppSt.backup = null;
      addLog(card.name+" forces the opponent's Backup into Primary.");
    } else {
      addLog(card.name+' finds nothing to reroute.');
    }
  }
  if(card.effect==='copyOppPrimaryStats'){
    const oppSt = state.players[oppKeyOf(ownerKey)];
    if(oppSt.primary){
      const targetP = effPower(oppSt.primary, oppSt), targetS = effStability(oppSt.primary, oppSt);
      card.bonusPower += (targetP - card.power);
      card.bonusStability += (targetS - card.stability);
      addLog(card.name+" extracts "+oppSt.primary.name+"'s current stats (Power "+targetP+' / Stability '+targetS+').');
    } else {
      addLog(card.name+' finds nothing to extract.');
    }
  }
  if(card.effect==='skipOppDeploy'){
    state.players[oppKeyOf(ownerKey)].skipNextDeploy = true;
    addLog(card.name+" blocks the opponent's next deploy.");
  }
  if(card.effect==='skipOppAttack'){
    state.players[oppKeyOf(ownerKey)].skipNextAttack = true;
    addLog(card.name+" blocks the opponent's next attack.");
  }
  render();
}

function promptDiscardOne(ownerKey){
  const st = state.players[ownerKey];
  if(st.hand.length===0) return;
  modal = {
    title:'Discard 1 card',
    items: st.hand.map(c=>({label:c.name, value:c.uid, card:c})),
    onPick:(uid)=>{
      const i = st.hand.findIndex(c=>c.uid===uid);
      if(i>=0){ const c=st.hand.splice(i,1)[0]; st.discard.push(c); addLog(label(ownerKey)+' discards '+c.name+'.'); }
      modal=null; render();
    }
  };
}

function canPlayPatch(ownerKey){
  const st = state.players[ownerKey];
  return st.patchesRemaining>0 && !st.attackedThisTurn;
}

function playPatch(ownerKey, uid){
  const st = state.players[ownerKey];
  if(!canPlayPatch(ownerKey)) return;
  const idx = st.hand.findIndex(c=>c.uid===uid);
  if(idx<0) return;
  const card = st.hand[idx];
  st.hand.splice(idx,1);
  st.discard.push(card);
  st.patchesRemaining--;
  st.overclockPlayedThisTurn = true;
  addLog(label(ownerKey)+' play '+card.name+'.', ownerKey==='A'?'you':'');
  showToast(label(ownerKey)+' plays '+card.name+' (Overclock)');
  resolvePatch(ownerKey, card);
  render();
}

function resolvePatch(ownerKey, card){
  const st = state.players[ownerKey];
  const oppKey = oppKeyOf(ownerKey);
  switch(card.effect){
    case 'attackAgain': st.extraAttack = (st.extraAttack||0) + 1; break;
    case 'extraDeploy': st.deploysRemaining += 1; break;
    case 'draw2': drawCards(st,2); break;
    case 'reroll': st.rerollCharges += 1; break;
    case 'tempPowerBuff3': {
      const target = st.primary;
      if(target){ target.tempPowerBonus = (target.tempPowerBonus||0) + 3; addLog(card.name+' gives '+target.name+' +3 Power until end of turn.', 'good'); }
      else addLog(card.name+' finds no Primary to boost.');
      break;
    }
    case 'crashOppPrimary': {
      const oppSt = state.players[oppKey];
      if(isImmuneToOppRemoval(oppSt.primary)){
        addLog(oppSt.primary.name+" can't be removed by opponent effects — "+card.name+' fails.');
      } else if(oppSt.primary){
        addLog(card.name+' force-crashes '+oppSt.primary.name+'.', 'bad');
        showToast(card.name+' kills '+oppSt.primary.name, 1600);
        crashOwnCard(oppKey, oppSt.primary);
      } else {
        addLog(card.name+' finds no Primary Agent to crash.');
      }
      break;
    }
    case 'mutualCrashPrimaries': {
      const oppSt = state.players[oppKey];
      if(st.primary){ addLog(st.primary.name+' is deprecated and crashes.', 'bad'); crashOwnCard(ownerKey, st.primary); }
      if(isImmuneToOppRemoval(oppSt.primary)){
        addLog(oppSt.primary.name+" can't be removed by opponent effects — it survives the wipe.");
      } else if(oppSt.primary){
        addLog(oppSt.primary.name+' is deprecated and crashes.', 'bad'); crashOwnCard(oppKey, oppSt.primary);
      }
      showToast(card.name+' wipes both Primaries', 1600);
      break;
    }
    case 'mutualRandomDiscard': discardRandom(st); discardRandom(state.players[oppKey]); break;
    case 'skipAttackDraw2': st.skipAttackThisTurn = true; drawCards(st,2); break;
    case 'skipOppPatch': state.players[oppKey].skipNextPatch = true; addLog(card.name+" blocks the opponent's next Overclock."); break;
    case 'skipOppAttack': state.players[oppKey].skipNextAttack = true; addLog(card.name+" blocks the opponent's next attack."); break;
    case 'discardOppRandom2Draw1':
      discardRandom(state.players[oppKey]);
      drawCards(st,1);
      break;
    case 'drawThenDiscard': drawCards(st,1); promptDiscardOne(ownerKey); break;
    case 'mulligan': {
      const n = st.hand.length;
      st.discard.push(...st.hand); st.hand=[];
      drawCards(st,n);
      break;
    }
    case 'look3take1': {
      const top = [];
      for(let i=0;i<3 && st.deck.length>0;i++){ top.push(st.deck.pop()); }
      if(top.length===0){ addLog('Deck empty — nothing to look at.'); break; }
      modal = {
        title:'Take 1 of these into hand',
        items: top.map(c=>({label:c.name, value:c.uid, card:c})),
        onPick:(uid)=>{
          const chosen = top.find(c=>c.uid===uid);
          top.forEach(c=>{ if(c.uid===uid) st.hand.push(c); else st.discard.push(c); });
          addLog(label(ownerKey)+' takes '+chosen.name+' into hand.');
          modal=null; render();
        }
      };
      break;
    }
    case 'tutor': {
      const names = {};
      st.deck.forEach(c=>{ names[c.name]=c; });
      const opts = Object.values(names);
      if(opts.length===0){ addLog('Deck is empty — nothing to search for.'); break; }
      modal = {
        title:'Search deck: add any card to hand',
        items: opts.map(c=>({label:c.name, value:c.uid, card:c})),
        onPick:(uid)=>{
          const i = st.deck.findIndex(c=>c.uid===uid);
          if(i>=0){ const c = st.deck.splice(i,1)[0]; st.hand.push(c); st.deck = shuffle(st.deck); addLog(label(ownerKey)+' tutors '+c.name+' into hand.'); }
          modal=null; render();
        }
      };
      break;
    }
    case 'stabilityBuff2': {
      const targets = [st.primary, st.backup].filter(Boolean);
      if(targets.length===0){ addLog('No Agent in play to buff.'); break; }
      if(targets.length===1){ targets[0].bonusStability += 2; addLog(targets[0].name+' gains +2 Stability (permanent).'); break; }
      modal = {
        title:'Buff which Agent? (+2 Stability, permanent)',
        items: targets.map(c=>({label:c.name, value:c.uid, card:c})),
        onPick:(uid)=>{
          const t = targets.find(c=>c.uid===uid);
          t.bonusStability += 2;
          addLog(t.name+' gains +2 Stability (permanent).');
          modal=null; render();
        }
      };
      break;
    }
    case 'reclaimCrashed': {
      const opts = st.discard.filter(c=>c.type==='process');
      if(opts.length===0){ addLog('No crashed Agent in discard to reclaim.'); break; }
      modal = {
        title:'Return which Agent to hand?',
        items: opts.map(c=>({label:c.name, value:c.uid, card:c})),
        onPick:(uid)=>{
          const i = st.discard.findIndex(c=>c.uid===uid);
          if(i>=0){ const c = st.discard.splice(i,1)[0]; st.hand.push(c); addLog(label(ownerKey)+' returns '+c.name+' to hand.'); }
          modal=null; render();
        }
      };
      break;
    }
  }
}

/* ---------- combat ---------- */
function triggerGlobalCrash(){
  ['A','B'].forEach(k=>{
    const st = state.players[k];
    [st.primary, st.backup].forEach(c=>{
      if(c && c.effect==='growOnAnyCrash'){
        c.bonusPower += 2;
        addLog(c.name+' grows +2 Power from the crash.');
      }
    });
  });
}

function crashOwnCard(ownerKey, inst){
  const st = state.players[ownerKey];
  if(st.primary===inst) st.primary=null;
  if(st.backup===inst) st.backup=null;
  if(inst.effect==='recycleOnCrash'){
    st.deck = shuffle(st.deck.concat([inst]));
    addLog(inst.name+" doesn't go to the discard — it's shuffled back into the deck.");
  } else {
    st.discard.push(inst);
  }
  if(inst.effect==='crashDiscardOpp'){
    discardRandom(state.players[oppKeyOf(ownerKey)]);
  }
  triggerGlobalCrash();
}

function checkWin(){
  ['A','B'].forEach(k=>{
    if(state.players[k].shipPoints>=WIN_POINTS && !state.gameOver){
      state.gameOver = true; state.winner = k;
    }
  });
}

function doOneAttack(activeKey){
  if(state.gameOver) return;
  const passiveKey = oppKeyOf(activeKey);
  const atkState = state.players[activeKey];
  const defState = state.players[passiveKey];
  const attacker = atkState.primary;
  if(!attacker){ addLog(label(activeKey)+' has no Agent to attack with.'); return; }

  if(attacker.effect==='coinSelfCrash'){
    const heads = coinFlip(attacker.name+' attack check', activeKey);
    if(!heads){ addLog(attacker.name+' guessed wrong and crashes itself.', 'bad'); crashOwnCard(activeKey, attacker); return; }
  }

  let power = effPower(attacker, atkState);
  if(attacker.effect==='attackBonus2'){ power += 2; }
  if(attacker.effect==='coinDoubleOrNothing'){
    const heads = coinFlip(attacker.name+' confidence check', activeKey);
    if(heads){ power *= 2; addLog(attacker.name+' doubles to '+power+' Power.', 'good'); }
    else { addLog(attacker.name+"'s attack does nothing.", 'bad'); return; }
  }

  const defender = defState.primary;
  if(!defender){
    atkState.shipPoints++;
    addLog(label(activeKey)+' scores an unblocked hit! Ship Points: '+atkState.shipPoints+'/'+WIN_POINTS, 'good');
    showToast('⚡ '+label(activeKey)+' lands a direct hit! '+atkState.shipPoints+'/'+WIN_POINTS, 1800);
    checkWin();
    return;
  }

  if(attacker.effect==='firstAttackBonus' && !attacker.hasAttacked){
    power += 5;
    addLog(attacker.name+' surges on its first attack (+5 Power, now '+power+').', 'good');
  }
  attacker.hasAttacked = true;

  const defenderPower = effPower(defender, defState);
  const attackerStability = effStability(attacker, atkState);
  const stab = effStability(defender, defState);
  let crashes = power >= stab;
  let attackerDied = false;

  if(defenderPower >= attackerStability){
    addLog(defender.name+' hits back with '+defenderPower+' Power — that exceeds '+attacker.name+"'s own "+attackerStability+' Stability, so it crashes from the counter-attack.', 'bad');
    showToast(defender.name+' counter-crashes '+attacker.name, 1600);
    attackerDied = true;
  }

  if(crashes && defender.effect==='coinPreventCrash'){
    const heads = coinFlip(defender.name+' self-repair check', passiveKey);
    if(heads){ crashes=false; addLog(defender.name+' fixes itself before crashing.', 'good'); }
  }
  if(crashes && defender.effect==='gracefulOnce' && !defender.usedGraceful){
    defender.usedGraceful=true; crashes=false; addLog(defender.name+' degrades gracefully instead of crashing (one-time).');
  }

  if(attackerDied){ crashOwnCard(activeKey, attacker); }

  if(crashes){
    addLog(attacker.name+' ('+power+') crashes '+defender.name+' ('+stab+').', 'bad');
    showToast(attacker.name+' crashes '+defender.name, 1600);
    crashOwnCard(passiveKey, defender);
    if(!defState.backup && !state.gameOver){
      atkState.shipPoints++;
      addLog(label(activeKey)+' scores a breakthrough — the opponent has no Backup. Ship Points: '+atkState.shipPoints+'/'+WIN_POINTS, 'good');
      showToast('⚡ '+label(activeKey)+' breaks through! '+atkState.shipPoints+'/'+WIN_POINTS, 1800);
      checkWin();
    }
    if(attacker.effect==='drawOnCrash'){ drawCards(atkState,1); addLog(attacker.name+' draws a card.'); }
    if(attacker.effect==='attackAgainOnCrash' && !attackerDied){
      atkState.extraAttack = (atkState.extraAttack||0) + 1;
      addLog(attacker.name+' crashed its target and gets to attack again this turn.', 'good');
    }
    if(attacker.effect==='stealOppCardOnCrash'){
      if(defState.hand.length>0){
        const si = Math.floor(Math.random()*defState.hand.length);
        const stolen = defState.hand.splice(si,1)[0];
        atkState.hand.push(stolen);
        addLog(attacker.name+' steals '+stolen.name+" from the opponent's hand.");
      } else {
        addLog(attacker.name+" finds the opponent's hand empty.");
      }
    }
    checkWin();
  } else if(!attackerDied){
    addLog(attacker.name+' ('+power+') bounces off '+defender.name+' ('+stab+'). No effect.');
  }
}

function performAttack(activeKey){
  const st = state.players[activeKey];
  st.patchesRemaining = 0;
  if(st.skipAttackThisTurn){ addLog(label(activeKey)+' skips their attack this turn.'); return; }
  const attackerRef = st.primary;
  if(attackerRef && attackerRef.deployedTurn === st.turnsTaken && attackerRef.effect!=='noSummoningSickness'){
    addLog(label(activeKey)+"'s "+attackerRef.name+" just came online this turn and can't attack yet.");
    return;
  }
  doOneAttack(activeKey);
  if(state.gameOver) return;
  if(attackerRef && attackerRef.effect==='attackTwiceSelfCrash' && (st.primary===attackerRef || st.backup===attackerRef)){
    doOneAttack(activeKey);
    if(!state.gameOver && (st.primary===attackerRef || st.backup===attackerRef)){
      addLog(attackerRef.name+' crashes itself after its double attack.');
      crashOwnCard(activeKey, attackerRef);
    }
  }
  while(!state.gameOver && (st.extraAttack||0)>0){
    st.extraAttack--;
    // Extra attacks can follow a crashed Primary: promote your own Backup
    // immediately so the extra swing has a body. Opponent Backup still waits
    // until end of turn, so a crash-then-chain can score an unblocked hit.
    if(!st.primary && st.backup){
      st.primary = st.backup;
      st.backup = null;
      addLog(label(activeKey)+"'s Backup jumps in for the extra attack.");
    }
    doOneAttack(activeKey);
  }
}

/* ---------- turn management ---------- */
function startTurn(key){
  const st = state.players[key];
  st.turnsTaken++;
  st.attackedThisTurn = false;

  if(st.skipNextDeploy){ st.deploysRemaining=0; st.skipNextDeploy=false; addLog(label(key)+"'s deploy is blocked this turn."); }
  else st.deploysRemaining = 1;

  if(st.skipNextPatch){ st.patchesRemaining=0; st.skipNextPatch=false; addLog(label(key)+"'s Overclock is blocked this turn."); }
  else st.patchesRemaining = 2;

  if(st.skipNextAttack){ st.skipAttackThisTurn=true; st.skipNextAttack=false; addLog(label(key)+"'s attack is blocked this turn."); }
  else st.skipAttackThisTurn = false;

  st.deploysThisTurn = 0;
  st.overclockPlayedThisTurn = false;

  [st.primary, st.backup].forEach(c=>{ if(c && c.effect==='growPerTurnSurvive') c.turnsSurvived = (c.turnsSurvived||0)+1; });

  // "Until end of turn" buffs expire the moment your next turn begins.
  [st.primary, st.backup].forEach(c=>{ if(c) c.tempPowerBonus = 0; });

  // Foothills of the Singularity: recursive self-improvement, each turn it survives.
  [st.primary, st.backup].forEach(c=>{
    if(c && c.effect==='singularityGrowth'){
      const heads = coinFlip(c.name+' recursive self-improvement check', key);
      if(heads){
        c.bonusPower = c.power + 2*(c.bonusPower||0);
        addLog(c.name+' doubles its Power to '+effPower(c, st)+'.', 'good');
      } else {
        addLog(c.name+' spirals out of control and crashes.', 'bad');
        crashOwnCard(key, c);
      }
    }
  });

  // Confidence Cascade: the safe cousin of Foothills — no downside, just slower.
  [st.primary, st.backup].forEach(c=>{
    if(c && c.effect==='coinGrowSafe'){
      const heads = coinFlip(c.name+' confidence check', key);
      if(heads){
        c.bonusPower = (c.bonusPower||0) + 1;
        addLog(c.name+' gains +1 Power permanently (now '+effPower(c, st)+').', 'good');
      }
    }
  });

  if(st.deck.length===0){
    state.gameOver = true; state.winner = oppKeyOf(key);
    addLog(label(key)+' cannot draw — deck out!', 'bad');
    return;
  }
  const card = st.deck.pop();
  st.hand.push(card);
  addLog('— Turn '+st.turnsTaken+': '+label(key)+' draws '+card.name+' —');
  state.active = key;

  if(key==='B' && mode==='ai' && !state.gameOver){
    setTimeout(()=>{ aiTakeTurn(); }, 250);
  }
}

function autoPromote(key){
  const st = state.players[key];
  if(!st.primary && st.backup){
    st.primary = st.backup;
    st.backup = null;
    addLog(label(key)+"'s Backup is promoted to Primary.");
  }
}

// Attacking is optional: clicking Attack is a deliberate, risky choice (see the
// counter-damage check inside doOneAttack). It does NOT end the turn by itself.
function handleAttackClick(key){
  const st = state.players[key];
  if(state.gameOver) return;
  if(st.attackedThisTurn){ addLog(label(key)+' has already attacked this turn.'); render(); return; }
  st.attackedThisTurn = true;
  performAttack(key);
  render();
}

// Ending the turn is always available and never forces an attack.
function handleEndTurnClick(key){
  if(state.gameOver){ render(); return; }
  autoPromote('A');
  autoPromote('B');
  const next = oppKeyOf(key);
  startTurn(next);
  render();
}

// Kept for the AI opponent, which always attacks then ends its turn in one step.
function handleAttackAndEndTurn(key){
  const st = state.players[key];
  st.attackedThisTurn = true;
  performAttack(key);
  if(state.gameOver){ render(); return; }
  autoPromote('A');
  autoPromote('B');
  const next = oppKeyOf(key);
  startTurn(next);
  render();
}

function swapSlots(key){
  const st = state.players[key];
  if(!st.backup){ render(); return; }
  if(st.backup.deployedTurn === st.turnsTaken){
    addLog(label(key)+"'s Backup was deployed this turn — can't swap it in yet.");
    render(); return;
  }
  if(!st.primary && st.backup){ st.primary = st.backup; st.backup = null; addLog(label(key)+' swaps Backup into Primary.'); }
  else if(st.primary && st.backup){ const t=st.primary; st.primary=st.backup; st.backup=t; addLog(label(key)+' swaps Primary and Backup.'); }
  render();
}

/* ---------- simple AI ---------- */
function aiPreviewCombat(activeKey){
  const st = state.players[activeKey];
  const defState = state.players[oppKeyOf(activeKey)];
  const attacker = st.primary;
  if(!attacker) return {can:false};
  if(st.skipAttackThisTurn) return {can:false};
  if(attacker.deployedTurn === st.turnsTaken && attacker.effect!=='noSummoningSickness') return {can:false};
  const defender = defState.primary;
  if(!defender) return {can:true, unblocked:true, crashDef:false, crashAtk:false};
  let power = effPower(attacker, st);
  if(attacker.effect==='attackBonus2') power += 2;
  if(attacker.effect==='firstAttackBonus' && !attacker.hasAttacked) power += 5;
  const crashDef = power >= effStability(defender, defState);
  const crashAtk = effPower(defender, defState) >= effStability(attacker, st);
  return {can:true, unblocked:false, crashDef, crashAtk};
}

async function aiTakeTurn(){
  const st = state.players.B;
  if(state.gameOver) return;

  const extra = st.hand.find(c=>c.type==='patch' && c.effect==='extraDeploy' && canPlayPatch('B'));
  if(extra && st.hand.some(c=>c.type==='process' && c.uid!==extra.uid)){
    playPatch('B', extra.uid);
    await wait(500);
  }

  while(st.deploysRemaining>0){
    const opts = st.hand.filter(c=>c.type==='process' && canDeploy('B',c));
    if(opts.length===0) break;
    opts.sort((a,b)=>{
      const bounceBoost = (c)=> (c.effect==='bounceOppPrimary' && state.players.A.primary) ? 8 : 0;
      const skipBoost = (c)=> (c.effect==='skipOppAttack') ? 4 : 0;
      const stealBoost = (c)=> (c.effect==='peekStealCard' && state.players.A.hand.length>0) ? 5 : 0;
      return (b.power + bounceBoost(b) + skipBoost(b) + stealBoost(b)) - (a.power + bounceBoost(a) + skipBoost(a) + stealBoost(a));
    });
    deployCard('B', opts[0].uid);
    await wait(500);
    if(modal){
      // Auto-pick the first (highest-value-looking) option for steal/discard/tutor.
      const pick = modal.items[0] && modal.items[0].value;
      if(pick!==undefined) modal.onPick(pick);
      else modal=null;
      render();
    }
  }

  const useful = {
    draw2:8, extraDeploy:7, attackAgain:7, skipAttackDraw2:3, drawThenDiscard:2,
    mulligan:2, reroll:4, tempPowerBuff3:5, crashOppPrimary:9, skipOppAttack:7,
    skipOppPatch:4, discardOppRandom2Draw1:6, tutor:8, look3take1:5,
    mutualCrashPrimaries:4, mutualRandomDiscard:2
  };
  while(st.patchesRemaining>0){
    const opts = st.hand.filter(c=>c.type==='patch' && useful[c.effect]);
    if(opts.length===0) break;
    opts.sort((a,b)=>(useful[b.effect]||0)-(useful[a.effect]||0));
    const pick = opts[0];
    if((useful[pick.effect]||0) < 4) break;
    playPatch('B', pick.uid);
    await wait(500);
    if(modal){
      const v = modal.items[0] && modal.items[0].value;
      if(v!==undefined) modal.onPick(v);
      else modal=null;
      render();
    }
  }

  await wait(300);
  const pv = aiPreviewCombat('B');
  const shouldSwing = pv.can && (pv.unblocked || (pv.crashDef && !pv.crashAtk) || (pv.crashDef && st.backup));
  if(shouldSwing) handleAttackAndEndTurn('B');
  else handleEndTurnClick('B');
}

/* ========================= RENDER ========================= */
function initialGlyph(name){
  const stripped = name.replace(/^(The|A|An)\s+/i,'').trim();
  return (stripped.charAt(0) || '?').toUpperCase();
}

// Shared visual *inner* markup for a card (no outer wrapper) — reused by hand cards,
// board slots, and modal pickers, each of which wraps it in the container they need.
// displayPower/displayStability let callers show *effective* (post-bonus) stats when relevant.
function cardFaceInner(c, opts){
  opts = opts || {};
  const isAgent = c.type==='process';
  const costBadge = isAgent ? '<div class="card-cost">'+esc(c.cost)+'</div>' : '<div class="card-cost" style="opacity:.35;">&mdash;</div>';
  const p = opts.displayPower!==undefined ? opts.displayPower : c.power;
  const s = opts.displayStability!==undefined ? opts.displayStability : c.stability;
  const statsRow = isAgent ? (
    '<div class="card-stats-row">'+
      '<span class="card-stat power"><span class="lbl">PWR</span>&nbsp;'+esc(p)+'</span>'+
      '<span class="card-stat stability"><span class="lbl">STB</span>&nbsp;'+esc(s)+'</span>'+
    '</div>'
  ) : '';
  const artSrc = safeArtSrc(c.art);
  return '<div class="card-top">'+
      '<div class="card-name">'+esc(c.name)+'</div>'+
      costBadge+
    '</div>'+
    '<div class="card-type">'+esc(TYPE_LABEL[c.type]||'')+'</div>'+
    '<div class="card-art">'+(artSrc
      ? '<img src="'+esc(artSrc)+'" alt="" loading="lazy">'
      : '<span class="glyph">'+esc(initialGlyph(c.name))+'</span>')+'</div>'+
    statsRow+
    '<div class="card-rules">'+(c.text&&c.text!=='—'?esc(c.text):'')+'</div>'+
    '<div class="card-flavor">'+esc(c.flavor||'')+'</div>';
}

function cardHTML(c, ownerKey, context){
  const isAgent = c.type==='process';
  let clickable = false, onclick='';
  if(context==='hand-human'){
    if(isAgent && canDeploy(ownerKey,c)){ clickable=true; onclick="deployCard('"+ownerKey+"','"+c.uid+"')"; }
    else if(!isAgent && canPlayPatch(ownerKey)){ clickable=true; onclick="playPatch('"+ownerKey+"','"+c.uid+"')"; }
  }
  const classAttr = 'card card-'+esc(c.deckKey)+(clickable?' playable':' disabled');
  return '<button class="'+classAttr+'" '+(clickable?'onclick="'+onclick+'"':'disabled')+'>'+cardFaceInner(c)+'</button>';
}

function slotHTML(inst, ownerState){
  if(!inst) return '<div class="slot"><div class="slot-empty-label">— empty —</div></div>';
  const p = effPower(inst, ownerState), s = effStability(inst, ownerState);
  const flashClass = (inst.uid===flashUid) ? ' flash' : '';
  return '<div class="slot filled"><div class="card board card-'+esc(inst.deckKey)+flashClass+'">'+
    cardFaceInner(inst, {displayPower:p, displayStability:s})+
  '</div></div>';
}

// Renders a clickable card face for use inside a picker modal.
function modalCardHTML(c, index){
  return '<button class="card card-'+esc(c.deckKey)+' playable" onclick="modalPick('+index+')">'+cardFaceInner(c)+'</button>';
}

function renderSelect(){
  const deckKeys = Object.keys(DECK_META);
  function col(pick, setter){
    return '<div class="select-col">'+deckKeys.map(k=>{
      const m = DECK_META[k];
      const sel = pick===k ? ' selected' : '';
      const deckArt = safeArtSrc(m.art);
      return '<button class="deck-option deck-'+esc(k)+sel+'" onclick="'+setter+"('"+k+"')"+'">'+
        (deckArt ? '<img class="deck-art" src="'+esc(deckArt)+'" alt="">' : '')+
        '<div class="deck-option-body">'+
          '<div class="dname">'+esc(m.label)+' — '+esc(m.tag)+'</div>'+
          '<div class="dblurb">'+esc(m.blurb)+'</div>'+
        '</div>'+
      '</button>';
    }).join('')+'</div>';
  }
  const ready = pickA && pickB && DECK_TEMPLATES;
  return '<div class="hero">'+
      '<h1 class="hero-title">SHIP IT<span class="cursor">&nbsp;</span></h1>'+
      '<div class="hero-sub">// duvo playtest build — 4 decks · 30 cards · first to '+WIN_POINTS+' · ~15–20 min</div>'+
    '</div>'+
    '<div class="pitch">'+
      '<p class="pitch-lead">A 2-player card battler about shipping AI products. Deploy Agents, swing for Ship Points, and try not to crash your own stack.</p>'+
      '<ul class="pitch-rules">'+
        '<li><b>Goal:</b> first to '+WIN_POINTS+' Ship Points wins. You score with an unblocked hit (they have no Primary) or a breakthrough (you crash their last Agent and they have no Backup).</li>'+
        '<li><b>Board:</b> each player has a Primary and a Backup Agent slot. Deploy Agents and play Overclocks from a 30-card deck.</li>'+
        '<li><b>Combat:</b> attacking is optional and risky. Your Primary hits theirs; if their Power meets your Stability, you crash too. Crashing their last Agent (no Backup) is a breakthrough and scores; crashing through a Backup does not.</li>'+
        '<li><b>Turn:</b> draw → deploy &amp; Overclock (up to 2 Overclocks, before Attack) → optionally Attack → End Turn. New Agents can\'t attack the turn they deploy.</li>'+
      '</ul>'+
    '</div>'+
    '<div class="select-grid">'+
      '<div>'+'<h3>Your deck</h3>'+col(pickA,'setPickA')+'</div>'+
      '<div>'+'<h3>Opponent deck</h3>'+col(pickB,'setPickB')+'</div>'+
    '</div>'+
    '<div class="mode-row">'+
      '<button class="mode-btn'+(mode==='ai'?' active':'')+'" onclick="setMode(&quot;ai&quot;)">Play vs AI</button>'+
      '<button class="mode-btn'+(mode==='hotseat'?' active':'')+'" onclick="setMode(&quot;hotseat&quot;)">Hotseat (control both)</button>'+
    '</div>'+
    '<button class="start-btn" '+(ready?'':'disabled')+' onclick="startMatch()">Start match</button>'+
    '<button class="rules-toggle" onclick="toggleRules()">'+(rulesOpen?'Hide detailed rules':'Detailed turn rules')+'</button>'+
    (rulesOpen ? rulesHTML() : '');
}

function rulesHTML(){
  return '<div class="rules-panel">'+
    '<h4>Setup</h4><p>Each player: 2 Agent slots (Primary/Backup), start at 0 Ship Points. First to '+WIN_POINTS+' wins. Opening hand is 5 cards; the second player draws 1 extra card.</p>'+
    '<h4>Each turn</h4><ol>'+
      '<li>Draw 1 card.</li>'+
      '<li>Optionally deploy 1 Agent into an empty slot (Cost ≤ current turn number, capped at 4). A newly deployed Agent can\'t attack the turn it comes online.</li>'+
      '<li>Optionally play up to 2 Overclocks — any time on your turn before you Attack, before or after deploying.</li>'+
      "<li>Attacking is optional and happens at most once per turn (click Attack). Your Primary attacks their Primary: Power &ge; Stability crashes their Agent. If they had no Backup, that's a breakthrough and you score a Ship Point. An unblocked hit (they have no Primary at all) also scores. Extra attacks can punch through after a crash, because their Backup does not promote until end of turn.</li>"+
      "<li><b>Attacking is a risk:</b> if the defending Agent's Power meets or beats your attacker's own Stability, your Agent crashes too — even if your attack also crashed theirs. A high-Stability Agent is safer to attack with than a high-Power one with no defense.</li>"+
      "<li>If a Primary is empty at the end of a turn, that player's Backup is automatically promoted into Primary.</li>"+
      "<li>You may manually swap Backup into Primary any time on your turn — except a Backup can't be swapped in on the same turn it was deployed.</li>"+
      "<li>Click End Turn whenever you're done — with or without attacking.</li>"+
    '</ol>'+
    "<h4>Losing</h4><p>Also lose immediately if you can't draw a card on your turn (deck out).</p>"+
  '</div>';
}

function renderMatch(){
  if(!state) return '';
  if(state.gameOver){
    return matchBoardHTML() + '<div class="game-over"><h2>'+(state.winner==='A'?'YOU WIN':'OPPONENT WINS')+'</h2>'+
      '<p>'+esc(label('A'))+': '+esc(state.players.A.shipPoints)+' — '+esc(label('B'))+': '+esc(state.players.B.shipPoints)+'</p>'+
      '<button class="start-btn" onclick="backToSelect()">New match</button></div>';
  }
  return matchBoardHTML();
}

function matchBoardHTML(){
  const A = state.players.A, B = state.players.B;
  const activeKey = state.active;
  const passiveKey = oppKeyOf(activeKey);
  const st = state.players[activeKey];
  const canAttack = !state.gameOver && (mode==='hotseat' || activeKey==='A');
  const isHotseat = mode==='hotseat';

  let modalHTML = '';
  if(modal){
    const hasCards = modal.items.length>0 && modal.items[0].card;
    modalHTML = '<div class="modal-overlay"><div class="modal-box"><h4>'+esc(modal.title)+'</h4>'+
      (hasCards
        ? '<div class="modal-cards">'+modal.items.map((it,i)=>modalCardHTML(it.card,i)).join('')+'</div>'
        : modal.items.map((it,i)=>'<button class="modal-opt" onclick="modalPick('+i+')">'+esc(it.label)+'</button>').join(''))+
    '</div></div>';
  }

  const turnBanner = isHotseat
    ? '<div class="turn-banner deck-'+esc(st.deckKey)+'">&#9656; '+esc(hotseatName(activeKey))+"'S TURN"+
      '<span class="sub">Pass the device — '+esc(DECK_META[st.deckKey].label)+' is up</span></div>'
    : '';

  const scoreLine = isHotseat
    ? '<div class="score">'+esc(hotseatName('A'))+' <b>'+esc(A.shipPoints)+'</b> — '+esc(hotseatName('B'))+' <b>'+esc(B.shipPoints)+'</b> / '+WIN_POINTS+'</div>'
    : '<div class="score">You <b>'+esc(A.shipPoints)+'</b> — Opponent <b>'+esc(B.shipPoints)+'</b> / '+WIN_POINTS+'</div>';

  let boardRowsHTML;
  if(isHotseat){
    const passiveSt = state.players[passiveKey];
    boardRowsHTML =
      '<div class="board-row inactive-row"><div class="board-row-label"><span>'+esc(hotseatName(passiveKey))+' ('+esc(DECK_META[passiveSt.deckKey].label)+') — waiting</span><span>Deck '+passiveSt.deck.length+' · Hand '+passiveSt.hand.length+' · Discard '+passiveSt.discard.length+'</span></div>'+
        '<div class="slots">'+slotHTML(passiveSt.primary,passiveSt)+slotHTML(passiveSt.backup,passiveSt)+'</div></div>'+
      '<div class="board-row active-row deck-'+esc(st.deckKey)+'"><div class="board-row-label"><span>&#9656; '+esc(hotseatName(activeKey))+' ('+esc(DECK_META[st.deckKey].label)+')</span><span>Deck '+st.deck.length+' · Hand '+st.hand.length+' · Discard '+st.discard.length+'</span></div>'+
        '<div class="slots">'+slotHTML(st.primary,st)+slotHTML(st.backup,st)+'</div></div>';
  } else {
    boardRowsHTML =
      '<div class="board-row"><div class="board-row-label"><span>Opponent ('+esc(DECK_META[B.deckKey].label)+')</span><span>Deck '+B.deck.length+' · Hand '+B.hand.length+' · Discard '+B.discard.length+'</span></div>'+
        '<div class="slots">'+slotHTML(B.primary,B)+slotHTML(B.backup,B)+'</div></div>'+
      '<div class="board-row"><div class="board-row-label"><span>You ('+esc(DECK_META[A.deckKey].label)+')</span><span>Deck '+A.deck.length+' · Hand '+A.hand.length+' · Discard '+A.discard.length+'</span></div>'+
        '<div class="slots">'+slotHTML(A.primary,A)+slotHTML(A.backup,A)+'</div></div>';
  }

  const handLabel = isHotseat
    ? '&#9656; '+esc(hotseatName(activeKey))+"'s hand"
    : (activeKey==='A' ? 'Your hand' : "Opponent's hand");
  const handRowClass = isHotseat ? ' active-row deck-'+esc(st.deckKey) : '';

  return (toast ? '<div class="toast">'+esc(toast)+'</div>' : '')+
    turnBanner+
    '<div class="topbar">'+
      scoreLine+
      '<div class="turn-indicator">Turn '+esc(st.turnsTaken)+' · '+esc(DECK_META[A.deckKey].label)+' vs '+esc(DECK_META[B.deckKey].label)+(isHotseat?'':' · Active: '+esc(label(activeKey)))+'</div>'+
      '<button class="new-match-btn" onclick="backToSelect()">New match</button>'+
    '</div>'+
    '<div class="board-area">'+
      '<div class="board-main">'+
        boardRowsHTML+
        '<div class="hand-row'+handRowClass+'">'+
          '<div class="board-row-label"><span>'+handLabel+'</span><span>Deploys left '+st.deploysRemaining+' · Overclocks left '+st.patchesRemaining+'</span></div>'+
          '<div class="hand-hint">Overclocks: up to 2 per turn, before you Attack. Play them as setup, then swing.</div>'+
          '<div class="hand-cards">'+
            (activeKey==='A' || mode==='hotseat'
              ? st.hand.map(c=>cardHTML(c, activeKey, 'hand-human')).join('')
              : '<div class="pcard-text">AI is thinking…</div>') +
          '</div>'+
          '<div class="action-row">'+
            (function(){
              const backupLocked = st.backup && st.backup.deployedTurn === st.turnsTaken;
              return '<button class="swap-btn" '+(backupLocked?'disabled title="Backup was deployed this turn — can\'t swap it in yet"':'')+' onclick="swapSlots(&quot;'+activeKey+'&quot;)">Swap Primary/Backup'+(backupLocked?' (locked this turn)':'')+'</button>';
            })()+
            (function(){
              const alreadyAttacked = st.attackedThisTurn;
              const sickness = st.primary && st.primary.deployedTurn === st.turnsTaken && st.primary.effect!=='noSummoningSickness';
              const attackDisabled = !canAttack || alreadyAttacked || st.skipAttackThisTurn || sickness;
              let label2 = 'Attack';
              if(alreadyAttacked) label2 = 'Attack (used)';
              else if(sickness) label2 = "Attack (Primary can't yet)";
              else if(st.skipAttackThisTurn) label2 = 'Attack (blocked)';
              return '<button class="action-btn attack-btn" '+(attackDisabled?'disabled':'')+' onclick="handleAttackClick(&quot;'+activeKey+'&quot;)">'+label2+'</button>';
            })()+
            '<button class="action-btn end-turn-btn" '+(canAttack?'':'disabled')+' onclick="handleEndTurnClick(&quot;'+activeKey+'&quot;)">End Turn</button>'+
          '</div>'+
          (function(){
            const opp = state.players[oppKeyOf(activeKey)];
            if(!st.primary || !opp.primary || st.attackedThisTurn) return '';
            const myStability = effStability(st.primary, st);
            const theirPower = effPower(opp.primary, opp);
            if(theirPower >= myStability){
              return '<div class="risk-note">⚠ '+esc(opp.primary.name)+"'s "+esc(theirPower)+' Power meets or beats your '+esc(st.primary.name)+"'s "+esc(myStability)+' Stability — attacking now will crash it too.</div>';
            }
            return '';
          })()+
        '</div>'+
      '</div>'+
      '<div class="log-panel"><div class="log-title">System log</div>'+
        state.log.slice().reverse().map(l=>'<div class="log-line '+esc(l.cls)+'">&gt; '+esc(l.msg)+'</div>').join('')+
      '</div>'+
    '</div>'+ modalHTML;
}

function render(){
  const app = document.getElementById('app');
  if(cardsLoadError){
    app.innerHTML = '<div class="hero"><h1 class="hero-title">SHIP IT</h1></div>'+
      '<div class="pitch"><p class="pitch-lead">Could not load <code>data/cards.json</code>.</p>'+
      '<p class="pitch-lead">'+esc(cardsLoadError)+'</p>'+
      '<p class="pitch-lead">Serve this folder over HTTP (<code>python3 -m http.server 8080</code>) instead of opening the file directly. GitHub Pages already includes the JSON next to this page.</p></div>';
    return;
  }
  if(!DECK_TEMPLATES){
    app.innerHTML = '<div class="hero"><h1 class="hero-title">SHIP IT<span class="cursor">&nbsp;</span></h1>'+
      '<div class="hero-sub">loading decks from data/cards.json…</div></div>';
    return;
  }
  app.innerHTML = screen==='select' ? renderSelect() : renderMatch();
}

function setPickA(k){ pickA=k; render(); }
function setPickB(k){ pickB=k; render(); }
function setMode(m){ mode=m; render(); }
function toggleRules(){ rulesOpen=!rulesOpen; render(); }
function backToSelect(){ screen='select'; state=null; modal=null; render(); }
function modalPick(i){ if(modal){ const cb=modal.onPick; const val=modal.items[i].value; cb(val); } }

loadCards();
</script>
